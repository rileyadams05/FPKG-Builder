name: Collect Linux release artifacts

on:
  workflow_dispatch:
    inputs:
      linux_run_id:
        description: Successful Linux packages workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux package artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-packages-and-binary
          run-id: ${{ inputs.linux_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifacts/incoming
      - name: Organize and checksum supported deliverables
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/final
          for pattern in 'FPKG-Builder-*-linux-x64.deb' 'FPKG-Builder-*-linux-x64.rpm' 'FPKG-Builder-*-source.zip'; do
            file="$(find release-artifacts/incoming -type f -name "$pattern" -print -quit)"
            test -n "$file" || { echo "Missing release artifact: $pattern" >&2; exit 1; }
            cp "$file" release-artifacts/final/
          done
          (cd release-artifacts/final && sha256sum *.deb *.rpm *-source.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages-and-checksums
          path: release-artifacts/final/
