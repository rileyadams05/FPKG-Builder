name: Linux packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test PlayGo chunk-hash allocation regression
        run: dotnet run --project src/Vortex.Engine.PlayGo.Tests/Vortex.Engine.PlayGo.Tests.csproj --configuration Release
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf \
            xvfb jq rpm zip dbus-daemon
      - name: Publish bundled Linux engine
        run: |
          rm -rf src-tauri/resources/engine
          mkdir -p src-tauri/resources/engine
          dotnet publish src/Vortex.Engine.Poc/Vortex.Engine.Poc.csproj -c Release -r linux-x64 \
            --self-contained true -p:PublishSingleFile=false -p:DebugType=None \
            -o src-tauri/resources/engine
          mv src-tauri/resources/engine/Vortex.Engine.Poc src-tauri/resources/engine/vortex-engine
          chmod 755 src-tauri/resources/engine/vortex-engine
          cp vendor/LibOrbisPkg/LICENSE.txt src-tauri/resources/LibOrbisPkg-LICENSE.txt
          cp THIRD_PARTY_NOTICES.md src-tauri/resources/THIRD_PARTY_NOTICES.md
      - name: Test GP4 reuse, generation, package build, progress and validation
        shell: bash
        run: |
          set -euo pipefail
          helper="$PWD/src-tauri/resources/engine/vortex-engine"
          testroot="$(mktemp -d)"
          mkdir -p "$testroot/generated/Itemzflow"
          "$helper" fixture "$testroot/generated/Itemzflow/CUSA00001"
          truncate -s 33554432 "$testroot/generated/Itemzflow/CUSA00001/content.bin"
          "$helper" process "$testroot/generated/Itemzflow" "$testroot/out-generated" > "$testroot/generated.jsonl"
          jq -e 'select(.event == "gp4-ready" and .mode == "generated")' "$testroot/generated.jsonl" >/dev/null
          jq -e 'select(.event == "completed" and .validation == "passed")' "$testroot/generated.jsonl" >/dev/null
          jq -e 'select(.event == "build-progress" and .bytesTotal != null and .bytesProcessed >= 0)' "$testroot/generated.jsonl" >/dev/null
          test ! -e "$testroot/generated/Itemzflow/CUSA00001/CUSA00001.gp4"
          mkdir -p "$testroot/reused/Itemzflow"
          "$helper" fixture "$testroot/reused/Itemzflow/CUSA00001"
          "$helper" gp4 "$testroot/reused/Itemzflow/CUSA00001" "$testroot/reused/Itemzflow/CUSA00001/CUSA00001.gp4"
          python3 - "$testroot/reused/Itemzflow/CUSA00001/CUSA00001.gp4" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          project = ET.parse(path)
          for entry in project.findall('.//file'):
              target = entry.attrib['targ_path']
              entry.set('orig_path', '/mnt/usb0/CUSA00001/' + target)
          project.write(path, encoding='utf-8', xml_declaration=True)
          PY
          gp4_hash="$(sha256sum "$testroot/reused/Itemzflow/CUSA00001/CUSA00001.gp4" | cut -d' ' -f1)"
          "$helper" process "$testroot/reused/Itemzflow" "$testroot/out-reused" > "$testroot/reused.jsonl"
          jq -e 'select(.event == "gp4-ready" and .mode == "reused")' "$testroot/reused.jsonl" >/dev/null
          jq -e 'select(.event == "completed" and .validation == "passed")' "$testroot/reused.jsonl" >/dev/null
          test "$gp4_hash" = "$(sha256sum "$testroot/reused/Itemzflow/CUSA00001/CUSA00001.gp4" | cut -d' ' -f1)"
          mkdir -p "$testroot/merged/Itemzflow/CUSA00001" "$testroot/merged/Itemzflow/CUSA00001-patch" "$testroot/merged/Itemzflow/CUSA00001-dlc"
          "$helper" fixture "$testroot/merged/Itemzflow/CUSA00001"
          "$helper" fixture "$testroot/merged/Itemzflow/CUSA00001-patch"
          "$helper" fixture "$testroot/merged/Itemzflow/CUSA00001-dlc"
          printf 'updated eboot data\n' > "$testroot/merged/Itemzflow/CUSA00001-patch/eboot.bin"
          printf 'patch-only data\n' > "$testroot/merged/Itemzflow/CUSA00001-patch/update-content.dat"
          : > "$testroot/merged/Itemzflow/CUSA00001.complete"
          printf 'ignored Itemzflow log\n' > "$testroot/merged/Itemzflow/daemon.log"
          "$helper" gp4 "$testroot/merged/Itemzflow/CUSA00001" "$testroot/merged/Itemzflow/CUSA00001/CUSA00001.gp4"
          "$helper" gp4 "$testroot/merged/Itemzflow/CUSA00001-patch" "$testroot/merged/Itemzflow/CUSA00001-patch/CUSA00001.gp4"
          sed -i 's/pkg_ps4_app/pkg_ps4_patch/' "$testroot/merged/Itemzflow/CUSA00001-patch/CUSA00001.gp4"
          base_gp4_hash="$(sha256sum "$testroot/merged/Itemzflow/CUSA00001/CUSA00001.gp4" | cut -d' ' -f1)"
          patch_gp4_hash="$(sha256sum "$testroot/merged/Itemzflow/CUSA00001-patch/CUSA00001.gp4" | cut -d' ' -f1)"
          "$helper" process "$testroot/merged/Itemzflow" "$testroot/out-merged" > "$testroot/merged.jsonl"
          jq -e 'select(.event == "update-merged")' "$testroot/merged.jsonl" >/dev/null
          jq -e 'select(.event == "completed" and .validation == "passed")' "$testroot/merged.jsonl" >/dev/null
          test "$(find "$testroot/out-merged" -maxdepth 1 -type f -name '*.pkg' | wc -l)" -eq 1
          test "$base_gp4_hash" = "$(sha256sum "$testroot/merged/Itemzflow/CUSA00001/CUSA00001.gp4" | cut -d' ' -f1)"
          test "$patch_gp4_hash" = "$(sha256sum "$testroot/merged/Itemzflow/CUSA00001-patch/CUSA00001.gp4" | cut -d' ' -f1)"
          test -f "$testroot/merged/Itemzflow/CUSA00001.complete"
          test -f "$testroot/merged/Itemzflow/daemon.log"
          mkdir -p "$testroot/update-source/CUSA00001-patch" "$testroot/update-pkg/Itemzflow/CUSA00001"
          "$helper" fixture "$testroot/update-source/CUSA00001-patch"
          "$helper" gp4 "$testroot/update-source/CUSA00001-patch" "$testroot/update-source/CUSA00001-patch/CUSA00001.gp4"
          sed -i 's/pkg_ps4_app/pkg_ps4_patch/' "$testroot/update-source/CUSA00001-patch/CUSA00001.gp4"
          "$helper" build-dump "$testroot/update-source/CUSA00001-patch" "$testroot/update-source-package"
          update_pkg="$(find "$testroot/update-source-package" -maxdepth 1 -type f -name '*.pkg' -print -quit)"
          test -n "$update_pkg"
          "$helper" fixture "$testroot/update-pkg/Itemzflow/CUSA00001"
          cp "$update_pkg" "$testroot/update-pkg/Itemzflow/Update.pkg"
          update_pkg_hash="$(sha256sum "$testroot/update-pkg/Itemzflow/Update.pkg" | cut -d' ' -f1)"
          "$helper" process "$testroot/update-pkg/Itemzflow" "$testroot/update-pkg-output" > "$testroot/update-pkg.jsonl"
          jq -e 'select(.event == "update-merged" and .source == "Update.pkg")' "$testroot/update-pkg.jsonl" >/dev/null
          jq -e 'select(.event == "completed" and .validation == "passed")' "$testroot/update-pkg.jsonl" >/dev/null
          test "$(find "$testroot/update-pkg-output" -maxdepth 1 -type f -name '*.pkg' | wc -l)" -eq 1
          test "$update_pkg_hash" = "$(sha256sum "$testroot/update-pkg/Itemzflow/Update.pkg" | cut -d' ' -f1)"
          mkdir -p "$testroot/itemzflow"
          "$helper" fixture "$testroot/itemzflow/CUSA00001"
          "$helper" gp4 "$testroot/itemzflow/CUSA00001" "$testroot/itemzflow/CUSA00001/CUSA00001.gp4"
          printf '[Settings]\nDumper_Path=%s\n' "$testroot/itemzflow" > "$testroot/settings.ini"
          "$helper" discover "$testroot/settings.ini" > "$testroot/discovery.jsonl"
          jq -e --arg dump "$testroot/itemzflow/CUSA00001" 'select(.event == "dump-candidate" and .path == $dump and .hasGp4 == true)' "$testroot/discovery.jsonl" >/dev/null
          jq -e 'select(.event == "discovery-complete" and .count == 1)' "$testroot/discovery.jsonl" >/dev/null
          if "$helper" process "$testroot/missing" "$testroot/out-fail" > "$testroot/error.jsonl" 2> "$testroot/error.txt"; then
            echo 'Invalid input unexpectedly succeeded' >&2; exit 1
          fi
          echo 'Linux helper fixture checks passed.'
      - name: Install frontend dependencies and build Debian and RPM packages
        run: |
          npm ci --no-audit --no-fund
          npm test
          cargo fetch --manifest-path src-tauri/Cargo.toml
          node tools/bundle-licenses.mjs src-tauri/resources/licenses
          cp THIRD_PARTY_NOTICES.md src-tauri/resources/THIRD_PARTY_NOTICES.md
          cp vendor/LibOrbisPkg/LICENSE.txt src-tauri/resources/LibOrbisPkg-LICENSE.txt
          npm run tauri:build -- --bundles deb,rpm
      - name: Inspect and install Debian package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/linux
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          deb_file="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          rpm_file="$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$deb_file" && test -n "$rpm_file"
          cp "$deb_file" "release-artifacts/linux/FPKG-Builder-${version}-linux-x64.deb"
          cp "$rpm_file" "release-artifacts/linux/FPKG-Builder-${version}-linux-x64.rpm"
          dpkg-deb --info release-artifacts/linux/*.deb
          dpkg-deb --contents release-artifacts/linux/*.deb
          sudo apt-get install -y ./release-artifacts/linux/*.deb
          command -v fpkg-builder
          Xvfb :117 -screen 0 1280x900x24 -nolisten tcp -ac > /tmp/vortex-ubuntu-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            [[ -S /tmp/.X11-unix/X117 ]] && break
            sleep 0.25
          done
          kill -0 "$xvfb_pid"
          set +e
          DISPLAY=:117 env -u WAYLAND_DISPLAY -u XAUTHORITY GDK_BACKEND=x11 \
            LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            dbus-run-session -- timeout 12s fpkg-builder > /tmp/fpkg-builder-launch.log 2>&1
          code=$?
          set -e
          cat /tmp/fpkg-builder-launch.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then cat /tmp/fpkg-builder-launch.log; exit "$code"; fi
          rpm -qpl release-artifacts/linux/*.rpm
          rpm -qp --requires release-artifacts/linux/*.rpm
      - name: Archive source corresponding to this build
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          mkdir -p release-artifacts/source
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          archive_root="FPKG-Builder-${version}"
          mkdir -p "$stage/$archive_root"
          git archive --format=tar HEAD | tar -xf - -C "$stage/$archive_root"
          mkdir -p "$stage/$archive_root/src-tauri/resources"
          cp -a src-tauri/resources/licenses "$stage/$archive_root/src-tauri/resources/"
          cp src-tauri/resources/THIRD_PARTY_NOTICES.md \
            src-tauri/resources/THIRD_PARTY_DEPENDENCY_LICENSES.md \
            src-tauri/resources/LibOrbisPkg-LICENSE.txt \
            "$stage/$archive_root/src-tauri/resources/"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/release-artifacts/source/FPKG-Builder-${version}-source.zip" "$archive_root")
          (cd release-artifacts/source && sha256sum *.zip > SHA256SUMS)
      - name: Upload Linux packages and shared application binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-and-binary
          path: |
            release-artifacts/linux/*
            release-artifacts/source/*
            src-tauri/target/release/fpkg-builder
            src-tauri/resources/engine/**
            src-tauri/resources/THIRD_PARTY_NOTICES.md
            src-tauri/resources/LibOrbisPkg-LICENSE.txt
            src-tauri/resources/licenses/**
            src-tauri/resources/THIRD_PARTY_DEPENDENCY_LICENSES.md

  fedora-smoke:
    needs: linux
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-and-binary
          path: /tmp/linux-input
      - name: Install RPM and smoke-launch the app
        shell: bash
        run: |
          set -euo pipefail
          rpm_file="$(find /tmp/linux-input -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_file"
          dnf -y install gtk3 webkit2gtk4.1 libayatana-appindicator-gtk3 \
            xorg-x11-server-Xvfb dejavu-sans-fonts dbus-daemon "$rpm_file"
          rpm -q fpkg-builder
          command -v fpkg-builder
          Xvfb :117 -screen 0 1280x900x24 -nolisten tcp -ac > /tmp/vortex-rpm-xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            [[ -S /tmp/.X11-unix/X117 ]] && break
            sleep 0.25
          done
          kill -0 "$xvfb_pid"
          set +e
          DISPLAY=:117 env -u WAYLAND_DISPLAY -u XAUTHORITY GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 dbus-run-session -- timeout 12s fpkg-builder > /tmp/fpkg-builder-rpm-launch.log 2>&1
          code=$?
          set -e
          cat /tmp/fpkg-builder-rpm-launch.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
    needs: [linux, fedora-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-and-binary
          path: release-artifacts/incoming
      - name: Validate version and stage release assets
        id: release-version
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          tag="v${version}"
          [[ "$RELEASE_COMMIT_MESSAGE" == "Release ${tag}"* ]]
          test "$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")" = "$version"
          test "$(node -p "JSON.parse(require('fs').readFileSync('package-lock.json','utf8')).version")" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)" = "$version"
          mkdir -p release-artifacts/publish
          for suffix in deb rpm; do
            name="FPKG-Builder-${version}-linux-x64.${suffix}"
            file="$(find release-artifacts/incoming -type f -name "$name" -print -quit)"
            test -n "$file"
            cp "$file" release-artifacts/publish/
          done
          source="$(find release-artifacts/incoming -type f -name "FPKG-Builder-${version}-source.zip" -print -quit)"
          test -n "$source"
          cp "$source" release-artifacts/publish/
          (cd release-artifacts/publish && sha256sum *.deb *.rpm *-source.zip > SHA256SUMS)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          find release-artifacts/publish -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FPKG Builder v${{ steps.release-version.outputs.version }}
          body_path: docs/releases/v${{ steps.release-version.outputs.version }}.md
          files: release-artifacts/publish/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
